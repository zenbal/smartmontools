name: Build Binaries

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub release after all build jobs pass
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-source:
    runs-on: ubuntu-latest
    outputs:
      SMARTMONTOOLS_PKG_VER: ${{ steps.version.outputs.SMARTMONTOOLS_PKG_VER }}
      SMARTMONTOOLS_GIT_REV_EPOCH: ${{ steps.version.outputs.SMARTMONTOOLS_GIT_REV_EPOCH }}
      SMARTMONTOOLS_GIT_COMMIT: ${{ steps.version.outputs.SMARTMONTOOLS_GIT_COMMIT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y automake build-essential

      - name: Prepare versioning
        id: version
        run: |
          cd smartmontools
          PKG_VER=$(./getversion.sh -p)
          GIT_REV_EPOCH=$(git log -1 --format=%at)
          GIT_COMMIT=$(git rev-parse HEAD)
          echo "SMARTMONTOOLS_PKG_VER=${PKG_VER}" >> "$GITHUB_OUTPUT"
          echo "SMARTMONTOOLS_GIT_REV_EPOCH=${GIT_REV_EPOCH}" >> "$GITHUB_OUTPUT"
          echo "SMARTMONTOOLS_GIT_COMMIT=${GIT_COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Build source tarball
        run: |
          cd smartmontools
          ./autogen.sh
          cd ..
          tar -czf smartmontools-src.tar.gz smartmontools/

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartmontools-src
          path: smartmontools-src.tar.gz
          if-no-files-found: error

  build-linux:
    needs: build-source
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Download source artifact
        uses: actions/download-artifact@v4
        with:
          name: smartmontools-src

      - name: Extract source
        run: tar -xzf smartmontools-src.tar.gz

      - name: Build and audit
        env:
          GIT_REV_EPOCH: ${{ needs.build-source.outputs.SMARTMONTOOLS_GIT_REV_EPOCH }}
          PKG_VER: ${{ needs.build-source.outputs.SMARTMONTOOLS_PKG_VER }}
          SOURCE_COMMIT: ${{ needs.build-source.outputs.SMARTMONTOOLS_GIT_COMMIT }}
        run: |
          cd smartmontools
          ./configure --with-build-info="(GHA/Linux)" \
            LDFLAGS="-static-libstdc++ -static-libgcc" \
            --without-libcap-ng --without-libsystemd \
            SOURCE_DATE_EPOCH=$((GIT_REV_EPOCH + 1))
          make -j"$(nproc)"
          make check
          python3 ../.github/scripts/package-binaries.py \
            --target "${{ matrix.target }}" \
            --version "$PKG_VER" \
            --source-commit "$SOURCE_COMMIT" \
            --source-dir . \
            --output-dir ../dist

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartmontools-${{ matrix.target }}
          path: dist/smartmontools-${{ matrix.target }}.tar.gz*
          if-no-files-found: error
          retention-days: 30

  build-darwin:
    needs: build-source
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Download source artifact
        uses: actions/download-artifact@v4
        with:
          name: smartmontools-src

      - name: Extract source
        run: tar -xzf smartmontools-src.tar.gz

      - name: Build and audit
        env:
          GIT_REV_EPOCH: ${{ needs.build-source.outputs.SMARTMONTOOLS_GIT_REV_EPOCH }}
          PKG_VER: ${{ needs.build-source.outputs.SMARTMONTOOLS_PKG_VER }}
          SOURCE_COMMIT: ${{ needs.build-source.outputs.SMARTMONTOOLS_GIT_COMMIT }}
        run: |
          cd smartmontools
          BUILD_TRIPLET=$(./config.guess)
          ./configure --build="$BUILD_TRIPLET" --host="$BUILD_TRIPLET" \
            --with-build-info="(GHA/arm64)" \
            --sysconfdir=/private/etc \
            SOURCE_DATE_EPOCH=$((GIT_REV_EPOCH + 1))
          make -j"$(sysctl -n hw.logicalcpu)"
          python3 ../.github/scripts/package-binaries.py \
            --target aarch64-apple-darwin \
            --version "$PKG_VER" \
            --source-commit "$SOURCE_COMMIT" \
            --source-dir . \
            --output-dir ../dist

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartmontools-aarch64-apple-darwin
          path: dist/smartmontools-aarch64-apple-darwin.tar.gz*
          if-no-files-found: error
          retention-days: 30

  build-windows:
    needs: build-source
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/smartmontools/docker-build:master
    steps:
      - name: Download source artifact
        uses: actions/download-artifact@v4
        with:
          name: smartmontools-src

      - name: Extract source
        run: tar -xzf smartmontools-src.tar.gz

      - name: Build
        env:
          GIT_REV_EPOCH: ${{ needs.build-source.outputs.SMARTMONTOOLS_GIT_REV_EPOCH }}
          PKG_VER: ${{ needs.build-source.outputs.SMARTMONTOOLS_PKG_VER }}
        run: |
          cd smartmontools
          ./configure --build=$(./config.guess) --host=x86_64-w64-mingw32 \
            --with-build-info="(GHA/static)" \
            SOURCE_DATE_EPOCH=$((GIT_REV_EPOCH + 1))
          make -j$(nproc)
          mkdir -p ../dist/bin ../dist/doc
          cp smartctl.exe smartd.exe ../dist/bin/
          cp os_win32/smartd_mailer.ps1 os_win32/smartd_warning.cmd ../dist/bin/ 2>/dev/null || true
          cp AUTHORS ChangeLog COPYING INSTALL NEWS README TODO smartd.conf ../dist/doc/ 2>/dev/null || true
          cd ../dist
          tar -czf ../smartmontools-windows-x86_64.tar.gz *

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartmontools-windows-x86_64
          path: smartmontools-windows-x86_64.tar.gz
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build-linux, build-darwin, build-windows, build-source]
    if: inputs.publish_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build-source.outputs.SMARTMONTOOLS_PKG_VER }}
        run: |
          TAG_NAME="v${RELEASE_VERSION}-$(date +'%Y%m%d%H%M')-${GITHUB_RUN_ID}"
          gh release create "$TAG_NAME" artifacts/* \
            --target "$GITHUB_SHA" \
            --title "Release ${RELEASE_VERSION}"
